name: Plugin Release

# Workflow riutilizzabile. Parte quando su main arriva un commit che alza la
# versione, tipicamente il merge della PR aperta da plugin-prepare-release.
#
# Perche' il trigger nel chiamante e' "push su main" e non "push di un tag":
# un tag creato con GITHUB_TOKEN non fa scattare altri workflow (GitHub lo
# impedisce per evitare loop). Tenendo tag, test e deploy in un unico workflow
# il problema non si pone e non serve un Personal Access Token.

on:
  workflow_call:
    inputs:
      slug:
        description: 'Slug su wordpress.org. Se omesso si usa il nome del repository'
        type: string
        required: false
        default: ''
      min-php:
        description: 'testVersion per PHPCompatibilityWP'
        type: string
        required: false
        default: '7.0-'
      run-tests:
        type: boolean
        required: false
        default: true
      force:
        description: 'Ripubblica anche se il tag esiste gia, per riprovare un deploy fallito'
        type: boolean
        required: false
        default: false
    secrets:
      SVN_USERNAME:
        required: true
      SVN_PASSWORD:
        required: true

permissions:
  contents: write

jobs:

  check:
    name: Serve un rilascio?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      should_release: ${{ steps.detect.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Confronta la versione dichiarata con i tag esistenti
        id: detect
        env:
          FORCE: ${{ inputs.force }}
        run: |
          VERSION="$(vendor/bin/wp-plugin-version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Versione $VERSION non ancora rilasciata: si procede."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [ "$FORCE" = "true" ]; then
            # Serve quando il tag e' stato creato ma il deploy su SVN e' fallito:
            # senza questa via d'uscita un nuovo tentativo non farebbe nulla.
            echo "Il tag v$VERSION esiste, ma e' stato richiesto force: si riprova."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Il tag v$VERSION esiste gia': nessun rilascio da fare."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Pubblica ${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: wordpress-org
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Determina lo slug
        id: slug
        env:
          SLUG_INPUT: ${{ inputs.slug }}
        run: |
          SLUG="${SLUG_INPUT:-${GITHUB_REPOSITORY#*/}}"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Slug wordpress.org: $SLUG"

      # ---- Ultimo cancello prima della pubblicazione -----------------------
      - name: Sintassi
        run: vendor/bin/wp-plugin-lint

      - name: Coerenza versioni
        run: vendor/bin/wp-plugin-check-version "${{ needs.check.outputs.version }}"

      - name: Compatibilita PHP
        run: >
          vendor/bin/phpcs -p
          --standard=PHPCompatibilityWP
          --runtime-set testVersion "${{ inputs.min-php }}"
          --extensions=php
          --ignore=vendor,node_modules,tests,build
          .

      # --do-not-cache-result: senza, PHPUnit lascia .phpunit.result.cache nella
      # radice e la action di deploy, che copia dal disco e non da git, lo
      # pubblicherebbe insieme al plugin.
      - name: Test
        if: inputs.run-tests
        run: vendor/bin/phpunit --do-not-cache-result

      # Va dopo i test proprio per intercettare gli artefatti che i test
      # possono aver lasciato nella radice.
      - name: Verifica il contenuto del pacchetto
        run: bash vendor/nigrosimone/wp-plugin-ci/bin/build-dist.sh "${RUNNER_TEMP}/dist-check"

      # ---- Tag ------------------------------------------------------------
      # Il tag viene creato prima del deploy: se la pubblicazione fallisce, agli
      # utenti non e' arrivato nulla. Il passo e' idempotente per permettere di
      # riprovare con "force" senza cancellare il tag a mano.
      - name: Crea il tag v${{ needs.check.outputs.version }}
        run: |
          TAG="v${{ needs.check.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Il tag $TAG esiste gia': lo riuso."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${{ needs.check.outputs.version }}"
          git push origin "$TAG"

      # ---- Pubblicazione su wordpress.org ---------------------------------
      # Sincronizza trunk/ e crea tags/VERSION su plugins.svn.wordpress.org,
      # escludendo quanto elencato in .distignore. Gli asset arrivano da
      # .wordpress-org/.
      - name: Deploy su WordPress.org
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ steps.slug.outputs.slug }}
          VERSION: ${{ needs.check.outputs.version }}
          ASSETS_DIR: .wordpress-org

      # ---- Release su GitHub ----------------------------------------------
      - name: Crea la Release su GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          files: ${{ steps.deploy.outputs.zip-path }}
          generate_release_notes: true
